<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>travel-expenses</title>
  </head>
  <body>
    <div id="app">
      <h1>Travel Expense Tracker</h1>

      <!-- BUDGET CALCULATOR -->
      <section>
        <h2>Budget Calculator</h2>
        <form id="budget-form">
          <label for="total-expenses">Total expenses (€):</label>
          <input type="number" id="total-expenses" required />

          <label for="budget">Budget (€):</label>
          <input type="number" id="budget" required />

          <button type="submit">Calculate</button>
        </form>
        <div id="budget-result"></div>
      </section>

      <!-- EXPENSE TRACKER -->
      <section>
        <h2>Expense Report</h2>
        <form id="expense-form">
          <label for="daily-expenses">Daily expenses (comma separated):</label>
          <input type="text" id="daily-expenses" placeholder="50, 0, 120, 85" required />

          <label for="daily-budget">Daily budget (€):</label>
          <input type="number" id="daily-budget" required />

          <button type="submit">Generate report</button>
        </form>
        <div id="expense-result"></div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
